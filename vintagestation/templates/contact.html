{% extends 'base.html' %}
{% load static %}
{% block content %}
<!-- Start Contact Form -->
    

<section class="contact-section">
  <div class="contact-container">
      <div class="contact-form">
          <h2>Contact Us</h2>
          <form action="#" method="POST" onsubmit="return validateEmail()">
            {% csrf_token %}
              <input type="text" placeholder="Enter your Name" required>
              <input type="email" id="email" placeholder="Enter a valid email address" required>
              <textarea placeholder="Enter your message" required></textarea>
              <button type="submit">Submit</button>
          </form>
      </div>
      <div class="contact-info">
          <img src="{% static '/images/bgyu.jpg' %}" alt="Sofa Image">
          <div class="info-details">
              <div class="call-us">
                  <h4>Call Us</h4>
                  <p>1 (234) 567-891,<br>1 (234) 987-654</p>
              </div>
              <div class="location">
                  <h4>Location</h4>
                  <p>121 Rock Street, 21 Avenue, New York, NY 92103-9000</p>
              </div>
              <div class="hours">
                  <h4>Hours</h4>
                  <p>Mon - Fri: 11 am - 8 pm,<br>Sat, Sun: 6 am - 8 pm</p>
              </div>
          </div>
      </div>
  </div>
</section>



  <!-- End Contact Form -->
       {% endblock content %}
